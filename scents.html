<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>House scents | Fieldnote</title>
<meta name="description" content="Six house scents, each mixed after you order. 50 ml $78, 100 ml $128.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><ellipse cx='16' cy='16' rx='11' ry='14' fill='%23F7F3EA' stroke='%231C1B19'/><text x='16' y='21' text-anchor='middle' font-family='serif' font-size='14'>F</text></svg>">
</head>
<body data-page="scents">
<main id="main">

  <section class="section tight">
    <div class="wrap">
      <h1 style="margin-bottom:16px">House scents</h1>
      <p class="lede" style="margin-bottom:36px">Six eaux de parfum, built to be worn every day. Each one is mixed for you after you order and labeled with your name.</p>
      <div class="filters" role="group" aria-label="Filter by family">
        <button class="chip" data-f="All" aria-pressed="true">All</button>
        <button class="chip" data-f="Clean" aria-pressed="false">Clean</button>
        <button class="chip" data-f="Fresh" aria-pressed="false">Fresh</button>
        <button class="chip" data-f="Green" aria-pressed="false">Green</button>
        <button class="chip" data-f="Warm" aria-pressed="false">Warm</button>
      </div>
      <div class="scent-grid" data-grid></div>
    </div>
  </section>
  <section class="section deep tight">
    <div class="wrap band">
      <div><h2>Can't choose?</h2></div>
      <div><p class="lede">Try all six at home for $22. The $22 comes off your first full bottle.</p><a class="btn" href="discovery.html">Get the Discovery Set</a></div>
    </div>
  </section>
</main>
<script src="assets/app.js"></script>
</body>
</html>
